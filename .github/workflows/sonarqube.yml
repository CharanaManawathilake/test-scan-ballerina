name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Scans the package at the repository root and reports to the SonarQube server in the
# SONAR_HOST_URL variable with the SONAR_TOKEN secret. The token needs the Execute Analysis and
# Create Projects permissions so that the project key is created on its first analysis, and the
# server needs the Ballerina plugin installed.

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloads the SonarQube plugin from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: ballerina-platform/scan-ballerina@v0
        with:
          ballerina-version: 2201.13.5
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: '${{ vars.SONAR_HOST_URL }}'
              token: '${{ secrets.SONAR_TOKEN }}'
              project-key: test-scan-ballerina
