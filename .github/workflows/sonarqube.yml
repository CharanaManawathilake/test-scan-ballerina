name: SonarQube

on:
  push:
    branches:
      - main
  # Pull requests run this scan only when they change the package or this workflow.
  pull_request:
    paths:
      - marketplace/**
      - .github/workflows/sonarqube.yml
  workflow_dispatch:

permissions:
  contents: read

# Scans the package in marketplace, with the action's support-in-source-suppressions branch, after
# bal build, since bal scan scans only packages whose dependencies are locked and pulled. Reports
# to the SonarQube server in the SONAR_HOST_URL variable with the SONAR_TOKEN secret. The token needs the
# Execute Analysis and Create Projects permissions so that the project key is created on its first
# analysis, and the server needs the Ballerina plugin installed.
# The package is not at the repository root: Ballerina 2201.12 does not load a package inside
# another package, such as order-service and the test packages.

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloads the SonarQube plugin from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: marketplace
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          paths: marketplace
          artifacts: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: '${{ vars.SONAR_HOST_URL }}'
              token: '${{ secrets.SONAR_TOKEN }}'
              project-key: test-scan-ballerina
