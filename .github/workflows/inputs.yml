    name: 22a. Package without Dependencies.toml (fails, before the tools are downloaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not built, since bal build would write the Dependencies.toml again.
      - name: Remove the committed Dependencies.toml
        run: rm test/projects/single/Dependencies.toml
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: missing-lock
          artifacts: true

  locked-dependencies:
    name: 22b. Package with a committed Dependencies.toml (passes, lock unchanged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.12.12
          packages: test/projects/locked
      # Its Dependencies.toml was written by Ballerina 2201.12.12, so that version runs it unchanged.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.12.12
          tool-version: 0.11.1
          paths: test/projects/locked
          category: locked-dependencies
          artifacts: true
      - name: Check that the committed Dependencies.toml is unchanged
        run: git diff --exit-code test/projects/locked

  scan-fails:
    name: 22c. Package that does not compile (fails, bal build and bal scan fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bal build fails on the compile error but pulls the dependencies, so bal scan runs too.
      - name: Build
        continue-on-error: true
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/broken
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/broken
          category: scan-fails
          artifacts: true
