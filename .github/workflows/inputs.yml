    name: 21c. Workspace with bal scan 0.11.1 on Ballerina 2201.13.5 (fails, bal scan 0.11.1 cannot scan workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/workspace
      # Ballerina 2201.13.5 has workspaces, so the error names bal scan 0.11.1 instead.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
