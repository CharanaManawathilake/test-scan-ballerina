name: Inputs

on:
  push:
    branches:
      - main
  # Pull requests run these cases only when they change them, so the order service pull requests
  # show only their own scan.
  pull_request:
    paths:
      - test/**
      - .github/workflows/inputs.yml
  workflow_dispatch:

permissions:
  contents: read

# Each job is one case, so its result, annotations and job summary show on their own.
# Each scan saves its SARIF file as an artifact named after its category. Artifact names are
# unique within a workflow run, so every scan has its own category.
# Findings bal scan reports for each package:
#   test/projects/single                    6 low
#   test/projects/multi/orders              1 low
#   test/projects/multi/payments            2 low
#   test/projects/services/api              1 low
#   test/projects/services/internal/legacy  2 low
#   test/projects/secrets                   1 medium
#   test/projects/with-tests                2 low, 1 of them in tests/
# Rules behind those findings:
#   single      ballerina:1, ballerina:2, ballerina:3, ballerina:7, ballerina:10, ballerina:11
#   secrets     ballerina:14
#   with-tests  ballerina:1 in main.bal, ballerina:1 in tests/main_test.bal
# The cases from 19 on cover Ballerina 2201.12 and bal scan 0.11.0, the oldest supported pair:
#   test/projects/oldest                    1 low (ballerina:1), for Ballerina 2201.12.0
#   test/projects/workspace                 a workspace of billing and shipping, 1 low each

jobs:
  compatible-versions:
    name: 1. Compatible Ballerina and scan tool versions (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.12.0
          paths: test/projects/single
          category: compatible-versions
          artifacts: true

  incompatible-versions:
    name: 2. Scan tool version incompatible with Ballerina (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bal scan 0.12.0 needs Ballerina 2201.13.0 or later. Both are given, so the pair fails with
      # the inputs, before Ballerina or the scan tool is installed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.12.0
          paths: test/projects/single
          category: incompatible-versions
          artifacts: true

  # Case 3, the upload to GitHub code scanning, is in code-scanning.yml, which runs on every pull
  # request.

  single-path:
    name: 4. One path with several packages (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          category: single-path
          artifacts: true

  exclude-paths:
    name: 5. Several paths with a package excluded (passes, 3 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: |
            test/projects/multi
            test/projects/services
          exclude-paths: test/projects/services/internal/legacy
          category: exclude-paths
          artifacts: true

  categories:
    name: 6. Two categories in one job (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan orders
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: orders
          artifacts: true
      - name: Scan payments
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          paths: test/projects/multi/payments
          category: payments
          artifacts: true

  fail-on-medium-low-findings:
    name: 7a. Fail on medium, low findings only (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: low-only
          artifacts: true
          fail-on-severity: medium

  fail-on-medium-medium-finding:
    name: 7b. Fail on medium, one medium finding (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The SARIF file is still saved when the gate fails.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/secrets
          category: medium
          artifacts: true
          fail-on-severity: medium

  fail-on-high-medium-finding:
    name: 7c. Fail on high, one medium finding (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/secrets
          category: high-only
          artifacts: true
          fail-on-severity: high

  fail-on-severity-uppercase:
    name: 7d. Fail on MEDIUM in upper case, one medium finding (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fail-on-severity is not case sensitive.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/secrets
          category: medium-uppercase
          artifacts: true
          fail-on-severity: MEDIUM

  max-findings-without-gate:
    name: 8. Max findings without fail-on-severity (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate is off, so max-findings has no effect, even with 6 findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: max-findings
          artifacts: true
          max-findings: 1

  severity-and-max-findings-at-limit:
    name: 9a. Fail on low with max findings at the limit (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 6 findings, and 6 are allowed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: at-limit
          artifacts: true
          fail-on-severity: low
          max-findings: 6

  severity-and-max-findings-over-limit:
    name: 9b. Fail on low with max findings over the limit (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 6 findings, and 5 are allowed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: over-limit
          artifacts: true
          fail-on-severity: low
          max-findings: 5

  annotations-on:
    name: 10a. Annotations on (passes, with annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: annotated
          artifacts: true
          annotations: true

  annotations-off:
    name: 10b. Annotations off (passes, no annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: plain
          artifacts: true
          annotations: false

  job-summary-on:
    name: 11a. Job summary on (passes, with a summary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: with-summary
          artifacts: true
          job-summary: true

  job-summary-off:
    name: 11b. Job summary off (passes, no summary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: without-summary
          artifacts: true
          job-summary: false

  artifacts-true:
    name: 12a. Save the SARIF file (passes, with an artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The artifact holds artifacts-true.sarif, the merged SARIF file of the 2 packages, only.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          category: artifacts-true
          artifacts: true

  artifacts-false:
    name: 12b. Artifacts false (passes, no artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: artifacts-false
          artifacts: false

  artifacts-default:
    name: 12c. Artifacts left out (passes, no artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: artifacts-default

  artifacts-invalid:
    name: 12d. Artifacts not true or false (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sarif was accepted before artifacts became true or false.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders
          category: artifacts-invalid
          artifacts: sarif

  include-rules:
    name: 13a. Include rules (passes, 2 of 6 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only ballerina:1 and ballerina:10 are reported, so the 2 findings fit max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: include-rules
          artifacts: true
          include-rules: ballerina:1,ballerina:10
          fail-on-severity: low
          max-findings: 2

  exclude-rules:
    name: 13b. Exclude rules (passes, 4 of 6 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ballerina:1 and ballerina:10 are left out, so the 4 other findings fit max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: exclude-rules
          artifacts: true
          exclude-rules: ballerina:1,ballerina:10
          fail-on-severity: low
          max-findings: 4

  exclude-medium-rule:
    name: 13c. Exclude the rule behind the medium finding (passes, no findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same scan as 7b, which fails without exclude-rules.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/secrets
          category: exclude-medium-rule
          artifacts: true
          exclude-rules: ballerina:14
          fail-on-severity: medium

  include-rule-matching-nothing:
    name: 13d. Include a rule no finding matches (passes, no findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: include-rule-matching-nothing
          artifacts: true
          include-rules: ballerina:999
          fail-on-severity: low

  include-and-exclude-rules:
    name: 13e. Include and exclude rules together (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: include-and-exclude-rules
          artifacts: true
          include-rules: ballerina:1
          exclude-rules: ballerina:10

  invalid-rule-id:
    name: 13f. Rule name instead of a rule ID (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single
          category: invalid-rule-id
          artifacts: true
          include-rules: ballerina:1,checkpanic

  exclude-tests-default:
    name: 14a. Exclude tests by default (passes, 1 of 2 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # exclude-tests is not set. The finding in tests/ is dropped, so 1 finding fits max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/with-tests
          category: exclude-tests-default
          artifacts: true
          fail-on-severity: low
          max-findings: 1

  exclude-tests-off:
    name: 14b. Keep the findings in tests (fails, 2 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The finding in tests/ is counted, so 2 findings are over max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/with-tests
          category: exclude-tests-off
          artifacts: true
          exclude-tests: false
          fail-on-severity: low
          max-findings: 1

  exclude-tests-invalid:
    name: 14c. exclude-tests that is not true or false (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/with-tests
          category: exclude-tests-invalid
          artifacts: true
          exclude-tests: 'yes'

  exclude-paths-single-star:
    name: 15a. Exclude with * that stays within one directory (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # legacy is two directories below services, so test/projects/*/legacy does not match it.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/services
          exclude-paths: test/projects/*/legacy
          category: exclude-paths-single-star
          artifacts: true

  exclude-paths-double-star:
    name: 15b. Exclude with ** that crosses directories (passes, 1 package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/services
          exclude-paths: test/projects/**/legacy
          category: exclude-paths-double-star
          artifacts: true

  exclude-paths-files:
    name: 15c. Exclude the files of a package (passes, 2 packages, 1 finding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # payments is still scanned, but its findings are dropped, so the 1 finding in orders fits max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          exclude-paths: test/projects/multi/payments/*.bal
          category: exclude-paths-files
          artifacts: true
          fail-on-severity: low
          max-findings: 1

  exclude-paths-everything:
    name: 15d. Exclude every package (passes, skipped with a warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          exclude-paths: test/projects/multi
          category: exclude-paths-everything
          artifacts: true

  exclude-paths-absolute:
    name: 15e. Absolute path in exclude-paths (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi
          exclude-paths: /test/projects/multi/payments
          category: exclude-paths-absolute
          artifacts: true

  comma-separated-paths:
    name: 16a. Comma separated paths (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/multi/orders,test/projects/services/api
          category: comma-separated-paths
          artifacts: true

  path-without-packages:
    name: 16b. Path without a package (passes, skipped with a warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: .github
          category: path-without-packages
          artifacts: true

  path-missing:
    name: 16c. Path that does not exist (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/missing
          category: path-missing
          artifacts: true

  path-file:
    name: 16d. Path to a file (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: test/projects/single/main.bal
          category: path-file
          artifacts: true

  path-outside-repository:
    name: 16e. Path outside the repository (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          paths: ..
          category: path-outside-repository
          artifacts: true

  default-versions:
    name: 17. Default Ballerina and scan tool versions (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the latest Ballerina and the latest scan tool Ballerina Central picks for it.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          paths: test/projects/single
          category: default-versions
          artifacts: true

  invalid-inputs:
    name: 18. Several invalid inputs (fails, every problem reported at once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: '2201 13'
          tool-version: '0.12'
          platforms: gitlab
          paths: test/projects/single
          category: invalid-inputs
          artifacts: true
          fail-on-severity: critical
          max-findings: '-1'
          annotations: 'yes'
          job-summary: 'no'

  oldest-versions:
    name: 19a. Ballerina 2201.12.0 with the latest compatible scan tool (passes, bal scan 0.11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ballerina Central picks bal scan 0.11.0 for Ballerina 2201.12. Its SARIF file has no rule
      # kinds, so the action takes them from the levels.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          paths: test/projects/oldest
          category: oldest-versions
          artifacts: true

  oldest-tool-version:
    name: 19b. Ballerina 2201.12.0 with tool-version 0.11.0 (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.11.0
          paths: test/projects/oldest
          category: oldest-tool-version
          artifacts: true

  old-tool-newer-ballerina:
    name: 19c. Ballerina 2201.13.5 with tool-version 0.11.0 (passes, 6 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A scan tool runs on the Ballerina it was built with and later ones.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.0
          paths: test/projects/single
          category: old-tool-newer-ballerina
          artifacts: true

  ballerina-below-minimum:
    name: 19d. Ballerina version below the minimum (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails with the inputs: bal scan 0.11.0 and later need Ballerina 2201.12.0 or later.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.11.0
          paths: test/projects/oldest
          category: ballerina-below-minimum
          artifacts: true

  tool-below-minimum:
    name: 19e. Scan tool version below the minimum (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails with the inputs: the oldest supported version is 0.11.0.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.10.0
          paths: test/projects/oldest
          category: tool-below-minimum
          artifacts: true

  ballerina-on-path:
    name: 20a. Ballerina 2201.12.0 already on the path (passes, uses it with bal scan 0.11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ballerina 2201.12.0
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.12.0
          github-token: ${{ github.token }}
      # ballerina-version is latest and no tool-version is given, so any Ballerina that runs a
      # supported scan tool is used, and nothing else is installed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          paths: test/projects/oldest
          category: ballerina-on-path
          artifacts: true

  ballerina-on-path-too-old:
    name: 20b. Ballerina 2201.12.0 on the path with tool-version 0.12.0 (passes, installs the latest Ballerina)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ballerina 2201.12.0
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.12.0
          github-token: ${{ github.token }}
      # bal scan 0.12.0 needs Ballerina 2201.13.0 or later, so the one on the path is not used.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          tool-version: 0.12.0
          paths: test/projects/single
          category: ballerina-on-path-too-old
          artifacts: true

  workspace-latest:
    name: 21a. Workspace with the latest Ballerina (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          paths: test/projects/workspace
          category: workspace-latest
          artifacts: true

  workspace-ballerina-12:
    name: 21b. Workspace on Ballerina 2201.12.0 (fails, Ballerina 2201.12.0 has no workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails before anything is scanned: one error names the workspace, and one says that this run
      # uses Ballerina 2201.12.0, which does not support workspaces. oldest is not scanned either.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          paths: test/projects/oldest, test/projects/workspace
          category: workspace-ballerina-12
          artifacts: true

  workspace-tool-0-11:
    name: 21c. Workspace with bal scan 0.11.0 on Ballerina 2201.13.5 (fails, bal scan 0.11.0 cannot scan workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ballerina 2201.13.5 has workspaces, so the error names bal scan 0.11.0 instead.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.0
          paths: test/projects/workspace
          category: workspace-tool-0-11
          artifacts: true

  workspace-excluded:
    name: 21d. Workspace left out with exclude-paths on Ballerina 2201.12.0 (passes, 1 package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fix the error in 21b suggests.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-scan-tool-0.11.0
        with:
          ballerina-version: 2201.12.0
          paths: test/projects/oldest, test/projects/workspace
          exclude-paths: test/projects/workspace
          category: workspace-excluded
          artifacts: true
