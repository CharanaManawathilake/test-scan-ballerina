    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails with the inputs: bal scan 0.11.0 and later need Ballerina 2201.12.0 or later.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.11.0
          tool-version: 0.11.1
          paths: test/projects/oldest
          category: ballerina-below-minimum
          artifacts: true

  tool-below-minimum:
    name: 19e. Scan tool version below the minimum (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.12.0
          packages: test/projects/oldest
      # Fails with the inputs: the oldest supported version is 0.11.0.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.10.0
          paths: test/projects/oldest
          category: tool-below-minimum
          artifacts: true

  ballerina-on-path:
    name: 20a. Ballerina 2201.12.0 already on the path (passes, uses it with bal scan 0.11.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ballerina 2201.12.0
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.12.0
          github-token: ${{ github.token }}
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          packages: test/projects/oldest
      # No ballerina-version is given and bal scan 0.11.1 runs on the Ballerina on the path, so
      # nothing else is installed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          tool-version: 0.11.1
          paths: test/projects/oldest
          category: ballerina-on-path
          artifacts: true

  ballerina-on-path-too-old:
    name: 20b. Ballerina 2201.12.0 on the path with tool-version 0.13.0 (passes, installs the latest Ballerina)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ballerina 2201.12.0
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.12.0
          github-token: ${{ github.token }}
      # Built with the Ballerina 2201.12.0 on the path, as a user would before the action.
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          packages: test/projects/single
      # bal scan 0.13.0 needs Ballerina 2201.13.2 or later, so the one on the path is not used.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          tool-version: 0.13.0
          paths: test/projects/single
          category: ballerina-on-path-too-old
