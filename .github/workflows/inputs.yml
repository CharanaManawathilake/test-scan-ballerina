          max-findings: '-1'
          annotations: 'yes'
          job-summary: 'no'

  oldest-versions:
    name: 19a. Ballerina 2201.12.0 with bal scan 0.11.1 (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.12.0
          packages: test/projects/oldest
      # Staging Central picks bal scan 0.11.1 for Ballerina 2201.12, but the action asks production
      # Central, which picks 0.11.0, so 0.11.1 is pinned. Its SARIF file has no rule
      # kinds, so the action takes them from the levels.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.11.1
          paths: test/projects/oldest
          category: oldest-versions
          artifacts: true

