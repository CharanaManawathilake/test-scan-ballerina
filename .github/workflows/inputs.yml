        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # A scan tool runs on the Ballerina it was built with and later ones.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: old-tool-newer-ballerina
          artifacts: true

  ballerina-below-minimum:
