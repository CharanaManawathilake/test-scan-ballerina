          category: workspace-latest
          artifacts: true

  workspace-ballerina-12:
    name: 21b. Workspace on Ballerina 2201.12.0 (fails, Ballerina 2201.12.0 has no workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ballerina 2201.12.0 has no workspaces, so only the package is built.
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.12.0
          packages: test/projects/oldest
      # Fails before anything is scanned: one error names the workspace, and one says that this run
