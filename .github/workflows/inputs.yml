name: Inputs

on:
  push:
    branches:
      - main
  # Pull requests run these cases only when they change them, so the order service pull requests
  # show only their own scan.
  pull_request:
    paths:
      - test/**
      - .github/workflows/inputs.yml
  workflow_dispatch:

# Test run of bal scan 0.11.1, published only to staging Central so far. The action still asks
# production Central for versions, so every scan names its tool-version.
env:
  BALLERINA_STAGE_CENTRAL: "true"

permissions:
  contents: read

# Each job is one case, so its result, annotations and job summary show on their own.
# Each scan saves its SARIF file as an artifact named after its category. Artifact names are
# unique within a workflow run, so every scan has its own category.
# Findings bal scan reports for each package:
#   test/projects/single                    6 low
#   test/projects/multi/orders              1 low
#   test/projects/multi/payments            2 low
#   test/projects/services/api              1 low
#   test/projects/services/internal/legacy  2 low
#   test/projects/secrets                   1 medium
#   test/projects/with-tests                2 low, 1 of them in tests/
# Rules behind those findings:
#   single      ballerina:1, ballerina:2, ballerina:3, ballerina:7, ballerina:10, ballerina:11
#   secrets     ballerina:14
#   with-tests  ballerina:1 in main.bal, ballerina:1 in tests/main_test.bal
# The cases from 19 on cover Ballerina 2201.12 and bal scan 0.11.1, the oldest supported pair:
#   test/projects/oldest                    1 low (ballerina:1), for Ballerina 2201.12.0
#   test/projects/workspace                 a workspace of billing and shipping, 1 low each
# bal scan scans only packages whose dependencies are locked and already pulled, and the action
# does not build them, so each job runs bal build first, with .github/actions/bal-build, as a user
# would. Each package also commits its Dependencies.toml. The cases from 22 on cover this:
#   test/projects/locked                    1 low (ballerina:1), its committed lock left unchanged
#   test/projects/broken                    does not compile

jobs:
  compatible-versions:
    name: 1. Compatible Ballerina and scan tool versions (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.13.0
          paths: test/projects/single
          category: compatible-versions
          artifacts: true

  incompatible-versions:
    name: 2. Scan tool version incompatible with Ballerina (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.12.0
          packages: test/projects/single
      # bal scan 0.12.0 needs Ballerina 2201.13.0 or later. Both are given, so the pair fails with
      # the inputs, before Ballerina or the scan tool is installed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.12.0
          tool-version: 0.12.0
          paths: test/projects/single
          category: incompatible-versions
          artifacts: true

  # Case 3, the upload to GitHub code scanning, is in code-scanning.yml, which runs on every pull
  # request.

  single-path:
    name: 4. One path with several packages (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/multi/orders
            test/projects/multi/payments
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi
          category: single-path
          artifacts: true

  exclude-paths:
    name: 5. Several paths with a package excluded (passes, 3 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/multi/orders
            test/projects/multi/payments
            test/projects/services/api
            test/projects/services/internal/legacy
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: |
            test/projects/multi
            test/projects/services
          exclude-paths: test/projects/services/internal/legacy
          category: exclude-paths
          artifacts: true

  categories:
    name: 6. Two categories in one job (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/multi/orders
            test/projects/multi/payments
      - name: Scan orders
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi/orders
          category: orders
          artifacts: true
      - name: Scan payments
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          paths: test/projects/multi/payments
          category: payments
          artifacts: true

  fail-on-medium-low-findings:
    name: 7a. Fail on medium, low findings only (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: low-only
          artifacts: true
          fail-on-severity: medium

  fail-on-medium-medium-finding:
    name: 7b. Fail on medium, one medium finding (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/secrets
      # The SARIF file is still saved when the gate fails.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/secrets
          category: medium
          artifacts: true
          fail-on-severity: medium

  fail-on-high-medium-finding:
    name: 7c. Fail on high, one medium finding (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/secrets
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/secrets
          category: high-only
          artifacts: true
          fail-on-severity: high

  fail-on-severity-uppercase:
    name: 7d. Fail on MEDIUM in upper case, one medium finding (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/secrets
      # fail-on-severity is not case sensitive.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/secrets
          category: medium-uppercase
          artifacts: true
          fail-on-severity: MEDIUM

  max-findings-without-gate:
    name: 8. Max findings without fail-on-severity (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # The gate is off, so max-findings has no effect, even with 6 findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: max-findings
          artifacts: true
          max-findings: 1

  severity-and-max-findings-at-limit:
    name: 9a. Fail on low with max findings at the limit (passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # 6 findings, and 6 are allowed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: at-limit
          artifacts: true
          fail-on-severity: low
          max-findings: 6

  severity-and-max-findings-over-limit:
    name: 9b. Fail on low with max findings over the limit (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # 6 findings, and 5 are allowed.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: over-limit
          artifacts: true
          fail-on-severity: low
          max-findings: 5

  annotations-on:
    name: 10a. Annotations on (passes, with annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: annotated
          artifacts: true
          annotations: true

  annotations-off:
    name: 10b. Annotations off (passes, no annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: plain
          artifacts: true
          annotations: false

  job-summary-on:
    name: 11a. Job summary on (passes, with a summary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: with-summary
          artifacts: true
          job-summary: true

  job-summary-off:
    name: 11b. Job summary off (passes, no summary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: without-summary
          artifacts: true
          job-summary: false

  artifacts-true:
    name: 12a. Save the SARIF file (passes, with an artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/multi/orders
            test/projects/multi/payments
      # The artifact holds artifacts-true.sarif, the merged SARIF file of the 2 packages, only.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi
          category: artifacts-true
          artifacts: true

  artifacts-false:
    name: 12b. Artifacts false (passes, no artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/multi/orders
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi/orders
          category: artifacts-false
          artifacts: false

  artifacts-default:
    name: 12c. Artifacts left out (passes, no artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/multi/orders
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi/orders
          category: artifacts-default

  artifacts-invalid:
    name: 12d. Artifacts not true or false (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/multi/orders
      # sarif was accepted before artifacts became true or false.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi/orders
          category: artifacts-invalid
          artifacts: sarif

  include-rules:
    name: 13a. Include rules (passes, 2 of 6 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # Only ballerina:1 and ballerina:10 are reported, so the 2 findings fit max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: include-rules
          artifacts: true
          include-rules: ballerina:1,ballerina:10
          fail-on-severity: low
          max-findings: 2

  exclude-rules:
    name: 13b. Exclude rules (passes, 4 of 6 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      # ballerina:1 and ballerina:10 are left out, so the 4 other findings fit max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: exclude-rules
          artifacts: true
          exclude-rules: ballerina:1,ballerina:10
          fail-on-severity: low
          max-findings: 4

  exclude-medium-rule:
    name: 13c. Exclude the rule behind the medium finding (passes, no findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/secrets
      # The same scan as 7b, which fails without exclude-rules.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/secrets
          category: exclude-medium-rule
          artifacts: true
          exclude-rules: ballerina:14
          fail-on-severity: medium

  include-rule-matching-nothing:
    name: 13d. Include a rule no finding matches (passes, no findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: include-rule-matching-nothing
          artifacts: true
          include-rules: ballerina:999
          fail-on-severity: low

  include-and-exclude-rules:
    name: 13e. Include and exclude rules together (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: include-and-exclude-rules
          artifacts: true
          include-rules: ballerina:1
          exclude-rules: ballerina:10

  invalid-rule-id:
    name: 13f. Rule name instead of a rule ID (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/single
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/single
          category: invalid-rule-id
          artifacts: true
          include-rules: ballerina:1,checkpanic

  exclude-tests-default:
    name: 14a. Exclude tests by default (passes, 1 of 2 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/with-tests
      # exclude-tests is not set. The finding in tests/ is dropped, so 1 finding fits max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/with-tests
          category: exclude-tests-default
          artifacts: true
          fail-on-severity: low
          max-findings: 1

  exclude-tests-off:
    name: 14b. Keep the findings in tests (fails, 2 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/with-tests
      # The finding in tests/ is counted, so 2 findings are over max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/with-tests
          category: exclude-tests-off
          artifacts: true
          exclude-tests: false
          fail-on-severity: low
          max-findings: 1

  exclude-tests-invalid:
    name: 14c. exclude-tests that is not true or false (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: test/projects/with-tests
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/with-tests
          category: exclude-tests-invalid
          artifacts: true
          exclude-tests: 'yes'

  exclude-paths-single-star:
    name: 15a. Exclude with * that stays within one directory (passes, 2 packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/services/api
            test/projects/services/internal/legacy
      # legacy is two directories below services, so test/projects/*/legacy does not match it.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/services
          exclude-paths: test/projects/*/legacy
          category: exclude-paths-single-star
          artifacts: true

  exclude-paths-double-star:
    name: 15b. Exclude with ** that crosses directories (passes, 1 package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/services/api
            test/projects/services/internal/legacy
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/services
          exclude-paths: test/projects/**/legacy
          category: exclude-paths-double-star
          artifacts: true

  exclude-paths-files:
    name: 15c. Exclude the files of a package (passes, 2 packages, 1 finding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/bal-build
        with:
          ballerina-version: 2201.13.5
          packages: |
            test/projects/multi/orders
            test/projects/multi/payments
      # payments is still scanned, but its findings are dropped, so the 1 finding in orders fits max-findings.
      - name: Scan
        uses: CharanaManawathilake/scan-ballerina@support-in-source-suppressions
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: test/projects/multi
          exclude-paths: test/projects/multi/payments/*.bal
          category: exclude-paths-files
          artifacts: true
          fail-on-severity: low
          max-findings: 1

  exclude-paths-everything:
    name: 15d. Exclude every package (passes, skipped with a warning)
    runs-on: ubuntu-latest
